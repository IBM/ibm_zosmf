# This playbook demonstrates using role
# 'zmf_swmgmt_deployment' to complete the software management
# Deployment V2 REST API.

#######################################################################################
# PLAY #1: Start a deployment on the source portable software instance.               #
#######################################################################################
- name: Deploy a portable software instance
  hosts: swmgmt
  gather_facts: false
  collections:
    - ibm.ibm_zosmf
  tasks:
    # Use the 'HLQ' high level qualifier (HLQ) and STANDARD storage class for all
    # target data sets in the deployment by default.
    - name: Setting the deployment HLQ and storage class parameters
      ansible.builtin.set_fact:
        deployment_hlq: HLQ
        deployment_storage_class: STANDARD
    - name: Start the deployment
      ansible.builtin.include_role:
        name: zmf_swmgmt_deployment
