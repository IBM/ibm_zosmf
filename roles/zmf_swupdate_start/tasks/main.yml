---
# Tasks file for zmf_swupdate_start play.

# Do not attempt to execute the play without a software instance or UUID specified.
- name: A software instance and system nickname or a UUID must be provided to the role
  ansible.builtin.fail:
    msg: "Specify a software instance and system nickname or a UUID and retry the role."
  when: >
    (software_instance_uuid is not defined or software_instance_uuid == '') and (software_instance_name is not defined or software_instance_name == ''
    or system_nickname is not defined or system_nickname == '')

# Do not attempt to execute the play without a targetzone.
- name: A target zone must be provided to the role
  ansible.builtin.fail:
    msg: "Specify a target zone and retry the role."
  when: >
    target_zone is not defined or target_zone == ''

# Do not attempt to execute the play without a list of updates, sourceids, or fixcats.
- name: A list of updates, sourceids, or fixcats must be provided to the role
  ansible.builtin.fail:
    msg: "Specify a list of updates, sourceids, or fixcats and retry the role."
  when: (updates is not defined) and (sourceids is not defined) and (fixcats is not defined)

# Do not attempt to execute the play without a z/OSMF host.
- name: Validate zmf_host is defined and not empty
  ansible.builtin.fail:
    msg: "zmf_host: Specify a z/OSMF host name and retry the role."
  when: zmf_host is not defined or zmf_host == ''

# Create a variable for the start software update response content.
- name: Initialize the container for the start software update response content
  ansible.builtin.set_fact:
    swupdate_start_response: ""

# Build the start software update request body.
- name: Build the start software update request content body
  ansible.builtin.set_fact:
    swupdate_start_request_body: >-
      {{
        {
          'targetzone': target_zone
        }
        | combine(
            (updates is defined)
            | ternary({'updates': updates}, {}),
            recursive=True
          )
        | combine(
            (sourceids is defined)
            | ternary({'sourceids': sourceids}, {}),
            recursive=True
          )
        | combine(
            (fixcats is defined)
            | ternary({'fixcats': fixcats}, {}),
            recursive=True
          )
        | combine(
            (suspend_steps is defined)
            | ternary({'suspend-steps': suspend_steps}, {}),
            recursive=True
          )
        | combine(
            (exclude_updates is defined)
            | ternary({'exclude-updates': exclude_updates}, {}),
            recursive=True
          )
        | combine(
            (resolve_holds is defined)
            | ternary({'resolve-holds': resolve_holds}, {}),
            recursive=True
          )
        | combine(
            (smpe_userid is defined)
            | ternary({'smpe-userid': smpe_userid}, {}),
            recursive=True
          )
        | combine(
            (notes is defined)
            | ternary({'notes': notes}, {}),
            recursive=True
          )
        | combine(
            (remote_zmf_user is defined)
            | ternary({'zosmfuid': remote_zmf_user}, {}),
            recursive=True
          )
        | combine(
            (remote_zmf_password is defined)
            | ternary({'zosmfpw': remote_zmf_password}, {}),
            recursive=True
          )
        | combine(
            (proxy_zmf_user is defined)
            | ternary({'proxyuid': proxy_zmf_user}, {}),
            recursive=True
          )
        | combine(
            (proxy_zmf_password is defined)
            | ternary({'proxypw': proxy_zmf_password}, {}),
            recursive=True
          )
      }}
  no_log: true

# Create and encode the HTTP Request URL with optional port
- name: Create the HTTP Request URL
  ansible.builtin.set_fact:
    request_url: >-
      {{ (zmf_host + (':' + zmf_port|string if zmf_port is defined and ':' not in zmf_host else ''))
      + '/zosmf/swmgmt/swi/'
      + (software_instance_uuid if software_instance_uuid is defined
         else system_nickname + '/' + software_instance_name)
      + '/swupdate' | urlencode }}

##########################################################################################
# URI MODULE #1: Start a software update for a software instance.                        #
##########################################################################################
- name: Start a software update for the software instance
  ansible.builtin.uri:
    url: "https://{{ request_url }}"
    return_content: true
    user: "{{ zmf_user | trim if zmf_user is defined else omit }}"
    password: "{{ zmf_password | trim if zmf_password is defined else omit }}"
    force_basic_auth: "{{ true if zmf_user is defined else omit }}"
    client_cert: "{{ zmf_client_cert | default(omit) }}"
    client_key: "{{ zmf_client_key | default(omit) }}"
    headers:
      Host: "{{ zmf_host }}"
      Origin: "https://{{ zmf_host }}"
    method: POST
    status_code: 202, 400, 403, 404, 409, 500, 503
    validate_certs: "{{ zmf_validate_certs }}"
    body_format: json
    body: "{{ swupdate_start_request_body }}"
  delegate_to: localhost
  register: swupdate_start_response

# Create a variable for the software update process ID.
- name: Set the software update process ID
  ansible.builtin.set_fact:
    swupdate_process_id: "{{ swupdate_start_response.json['processid'] }}"
  when: swupdate_start_response.status == 202

# Issue a failure message when the request fails.
- name: Display Start Software Update REST API failure information
  ansible.builtin.fail:
    msg: >-
      Start Software Update REST API failure details:
      {{ swupdate_start_response.json | default(swupdate_start_response) }}
  when: swupdate_start_response.status != 202
