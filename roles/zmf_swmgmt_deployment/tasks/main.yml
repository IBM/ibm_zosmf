---
# Tasks file for zmf_swmgmt_deployment play.

# Do not attempt to execute the play without a deployment name.
- name: Validate deployment_name is defined
  ansible.builtin.fail:
    msg: "deployment_name: Specify a deployment name and retry the role."
  when: deployment_name is not defined or deployment_name == ''

# Do not attempt to execute the play without a deployment source type.
- name: Validate deployment_source_type is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_source_type: Specify a deployment source type and retry the role."
  when: deployment_source_type is not defined or deployment_source_type == ''

# Do not attempt to execute the play without a deployment source name.
- name: Validate deployment_source_name is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_source_name: Specify a deployment source software instance name and retry the role."
  when: deployment_source_name is not defined or deployment_source_name == ''

# Do not attempt to execute the play without a deployment source system.
- name: Validate deployment_source_system is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_source_system: Specify a deployment source system nickname and retry the role."
  when: deployment_source_system is not defined or deployment_source_system == ''

# Do not attempt to execute the play without a deployment target name.
- name: Validate deployment_target_name is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_target_name: Specify a deployment target software instance name and retry the role."
  when: deployment_target_name is not defined or deployment_target_name == ''

# Do not attempt to execute the play without a deployment target system.
- name: Validate deployment_target_system is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_target_system: Specify a deployment target system nickname and retry the role."
  when: deployment_target_system is not defined or deployment_target_system == ''

# Do not attempt to execute the play without a deployment configuration or both a deployment
# high level qualifier (HLQ) and a deployment storage class.
- name: Validate deployment configuration or HLQ/storage class combination
  ansible.builtin.fail:
    msg: "Specify a deployment configuration or both deployment HLQ and storage class and retry the role."
  when: >
    ((deployment_configuration | default('')) | length == 0) and
    (((deployment_hlq | default('')) | length == 0) or
     ((deployment_storage_class | default('')) | length == 0))

# Do not attempt to execute the play without deployment system settings.
- name: Validate deployment_systemsettings is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_systemsettings: Specify deployment system settings and retry the role."
  when: deployment_systemsettings is not defined or deployment_systemsettings == ''

# Do not attempt to execute the play without a deployment response file.
- name: Validate deployment_response_file is defined and not empty
  ansible.builtin.fail:
    msg: "deployment_response_file: Specify a deployment response file and retry the role."
  when: deployment_response_file is not defined or deployment_response_file == ''

# Do not attempt to execute the play without a z/OSMF host.
- name: Validate zmf_host is defined and not empty
  ansible.builtin.fail:
    msg: "zmf_host: Specify a z/OSMF host name and retry the role."
  when: zmf_host is not defined or zmf_host == ''

# Create a variable for the deployment response content.
- name: Initialize the container for the deployment response content
  ansible.builtin.set_fact:
    deployment_response: ""

# Build deployment_configuration from the deployment HLQ and storage class when a
# deployment configuration was not specified.
- name: Build deployment_configuration using the deployment HLQ and storage class
  ansible.builtin.set_fact:
    deployment_configuration:
      datasets:
        - if: "dsname=*.**"
          then:
            - property: "dsname"
              from: "*.**"
              to: "*.{{ deployment_hlq }}.**"
            - property: "storclas"
              to: "{{ deployment_storage_class }}"
  when:
    - deployment_configuration is not defined
    - deployment_hlq is defined
    - deployment_storage_class is defined

# Build the deployment request body.
- name: Build the deployment request content body
  ansible.builtin.set_fact:
    deployment_request_body: >-
      {{
        {
          'name': deployment_name,
          'source': {
            'type': deployment_source_type,
            'name': deployment_source_name,
            'system': deployment_source_system
          },
          'targetswi': {
            'name': deployment_target_name,
            'system': deployment_target_system
          },
          'systemsettings': deployment_systemsettings
        }
        | combine(
            (deployment_description is defined)
            | ternary({'description': deployment_description}, {}),
            recursive=True
          )
        | combine(
            (deployment_submitjobs is defined)
            | ternary({'submitjobs': deployment_submitjobs}, {}),
            recursive=True
          )
        | combine(
            (deployment_configuration is defined)
            | ternary({'configuration': deployment_configuration}, {}),
            recursive=True
          )
      }}
  no_log: true

# Create and encode the HTTP Request URL with optional port
- name: Create the Deployment HTTP Request URL
  ansible.builtin.set_fact:
    request_url: >-
      {{ (zmf_host + (':' + zmf_port|string if zmf_port is defined and ':' not in zmf_host else ''))
      + '/zosmf/swmgmt/v2/dep' }}

##########################################################################################
# URI MODULE #1: Start a software management deployment request.                         #
##########################################################################################
- name: Start a software management deployment
  ansible.builtin.uri:
    url: "https://{{ request_url }}"
    return_content: true
    user: "{{ zmf_user | trim }}"
    password: "{{ zmf_password | trim }}"
    force_basic_auth: true
    headers:
      Host: "{{ zmf_host }}"
      Origin: "https://{{ zmf_host }}"
    method: POST
    status_code: 202, 400, 403, 404, 409, 500, 503
    validate_certs: "{{ zmf_validate_certs }}"
    body_format: json
    body: "{{ deployment_request_body }}"
  delegate_to: localhost
  register: deployment_response

# Create a variable for the deployment status monitor URL.
- name: Set the deployment status monitor URL
  ansible.builtin.set_fact:
    swmgmt_deployment_status_monitor_url: "{{ deployment_response.json['statusurl'] }}"
  when: deployment_response.status == 202

# Issue a failure message when the request fails.
- name: Display Deployment REST API failure information
  ansible.builtin.fail:
    msg: >-
      Deployment REST API failure details:
      {{ deployment_response.json | default(deployment_response) }}
  when: deployment_response.status != 202

#####################################################################
# URI MODULE #2: Check the status of the deployment async request.  #
#####################################################################

# Wait for the asynchronous thread to finish and return a response.
- name: >
    Check the status of the deployment operation every {{ status_retrieval_delay }}
    second(s) until it finishes or the maximum {{ status_retrieval_retries }} retries(s) is reached
  ansible.builtin.uri:
    url: "{{ swmgmt_deployment_status_monitor_url }}"
    method: GET
    user: "{{ zmf_user | trim }}"
    password: "{{ zmf_password | trim }}"
    force_basic_auth: true
    headers:
      Host: "{{ zmf_host }}"
      Origin: "https://{{ zmf_host }}"
    status_code: 200, 400, 403, 404, 409, 500, 503
    validate_certs: "{{ zmf_validate_certs }}"
    return_content: true
  register: deployment_response
  delegate_to: localhost
  until: >
    (deployment_response is failed) or
    (deployment_response.status != 200) or
    (deployment_response.json.status is defined and deployment_response.json.status == 'complete')
  retries: "{{ status_retrieval_retries }}"
  delay: "{{ status_retrieval_delay }}"

# Save the deployment operation's response in a file.
- name: Write the results for the deployment operation to a JSON file
  when: >
        deployment_response.status == 200 and
        deployment_response.json['status'] is defined and
        deployment_response.json['status'] == 'complete'
  block:
    - name: Copy the deployment results to a JSON file
      ansible.builtin.copy:
        content: '{{ deployment_response.json | default("") | to_nice_json(indent=2) }}'
        dest: '{{ deployment_response_file }}'
        mode: '0644'
      delegate_to: localhost
    
    - name: Create a variable to hold the deployment response json
      ansible.builtin.set_fact:
        deployment_response_json: "{{ deployment_response.json }}"

# Issue a failure message and stop the playbook.
- name: Display Retrieve Deployment Status REST API failure information
  ansible.builtin.fail:
    msg: >-
      {% if deployment_response.status == 404 %}
      There was an error encountered during Retrieve Deployment Status REST API execution. It's possible the host
      system is missing required USERMOD which contains the deployment V2 REST API. Otherwise the
      specified software was not found.
      {% endif %}
      Retrieve Deployment Status failure details: {{ deployment_response.json | default(deployment_response) }}
  when: deployment_response.status != 200
  