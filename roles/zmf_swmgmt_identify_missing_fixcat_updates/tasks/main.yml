---
# Tasks file for zmf_swmgmt_identify_missing_fixcat_updates play.

# Do not attempt to execute the play without a software instance or UUID.
- name: A software instance and system nickname or a UUID must be provided to the role
  ansible.builtin.fail:
    msg: "Specify a software instance and system nickname or a UUID and retry the role."
  when: >
    (software_instance_uuid is not defined or software_instance_uuid == '') and (software_instance_name is not defined or software_instance_name == ''
    or system_nickname is not defined or system_nickname == '')

# Do not attempt to execute the play without a missing fixcat updates response file.
- name: A missing fixcat updates response file must be provided to the role
  ansible.builtin.fail:
    msg: "Specify a missing fixcat updates response file and retry the role."
  when: missing_fixcat_updates_response_file is not defined

# Do not attempt to execute the play without a z/OSMF host.
- name: Validate zmf_host is defined and not empty
  ansible.builtin.fail:
    msg: "zmf_host: Specify a z/OSMF host name and retry the role."
  when: zmf_host is not defined or zmf_host == ''

# Create a variable for the missing fixcat updates response content.
- name: Initialize the container for the missing fixcat updates response content
  ansible.builtin.set_fact:
    missing_fixcat_updates_response: ""

# Build the missing fixcat updates request body.
- name: Build the missing fixcat updates request content body
  ansible.builtin.set_fact:
    missing_fixcat_updates_request_body: >-
      {{
        {}
        | combine(
            (remote_zmf_user is defined)
            | ternary({'zosmfuid': remote_zmf_user}, {}),
            recursive=True
          )
        | combine(
            (remote_zmf_password is defined)
            | ternary({'zosmfpw': remote_zmf_password}, {}),
            recursive=True
          )
        | combine(
            (proxy_zmf_user is defined)
            | ternary({'proxyuid': proxy_zmf_user}, {}),
            recursive=True
          )
        | combine(
            (proxy_zmf_password is defined)
            | ternary({'proxypw': proxy_zmf_password}, {}),
            recursive=True
          )
      }}
  no_log: true

# Create and encode the HTTP Request URL with optional port
- name: Create the HTTP Request URL
  ansible.builtin.set_fact:
    request_url: >-
      {{ (zmf_host + (':' + zmf_port|string if zmf_port is defined and ':' not in zmf_host else ''))
      + '/zosmf/swmgmt/swi/'
      + (software_instance_uuid if software_instance_uuid is defined
         else system_nickname + '/' + software_instance_name)
      + '/missingfixcatupdates' | urlencode }}

########################################################################################
# URI MODULE #1: Start a missing fixcat updates async request for a software instance. #
########################################################################################
- name: Determining the missing fixcat software updates for the software instance
  ansible.builtin.uri:
    url: "https://{{ request_url }}"
    return_content: true
    user: "{{ zmf_user | trim if zmf_user is defined else omit }}"
    password: "{{ zmf_password | trim if zmf_password is defined else omit }}"
    force_basic_auth: "{{ true if zmf_user is defined else omit }}"
    client_cert: "{{ zmf_client_cert | default(omit) }}"
    client_key: "{{ zmf_client_key | default(omit) }}"
    headers:
      Host: "{{ zmf_host }}"
      Origin: "https://{{ zmf_host }}"
    method: POST
    status_code: 202, 400, 403, 404, 409, 500, 503
    validate_certs: "{{ zmf_validate_certs }}"
    body_format: json
    body: "{{ missing_fixcat_updates_request_body }}"
  delegate_to: localhost
  register: missing_fixcat_updates_response

# Create a variable for the missing fixcat updates status monitor URL.
- name: Set the missing fixcat updates status monitor URL
  ansible.builtin.set_fact:
    missing_fixcat_updates_status_monitor_url: "{{ missing_fixcat_updates_response.json['statusurl'] }}"
  when: missing_fixcat_updates_response.status == 202

# Issue a failure message when the request fails.
- name: Display Missing Fixcat Updates REST API failure information
  ansible.builtin.fail:
    msg: >-
      Missing Fixcat Updates REST API failure details:
      {{ missing_fixcat_updates_response.json | default(missing_fixcat_updates_response) }}
  when: missing_fixcat_updates_response.status != 202

################################################################################
# URI MODULE #2: Check the status of the missing fixcat updates async request. #
################################################################################

# Wait for the asynchronous thread to finish and return a response.
- name: >
    Poll the status monitor URL of the missing fixcat updates operation every {{ status_retrieval_delay }}
    second(s) until it is finished or maximum {{ status_retrieval_retries }} poll(s) reached
  ansible.builtin.uri:
    url: "{{ missing_fixcat_updates_status_monitor_url }}"
    method: GET
    user: "{{ zmf_user | trim if zmf_user is defined else omit }}"
    password: "{{ zmf_password | trim if zmf_password is defined else omit }}"
    force_basic_auth: "{{ true if zmf_user is defined else omit }}"
    client_cert: "{{ zmf_client_cert | default(omit) }}"
    client_key: "{{ zmf_client_key | default(omit) }}"
    headers:
      Host: "{{ zmf_host }}"
      Origin: "https://{{ zmf_host }}"
    status_code: 200
    validate_certs: "{{ zmf_validate_certs }}"
    return_content: true
  register: missing_fixcat_updates_response
  delegate_to: localhost
  # This task's URL will be called repeatedly either until the "until" condition is met (request failed or
  # request completed) or the request still isn't finished after the specified "complete_check_times" attempts.
  until: (missing_fixcat_updates_response is failed) or (missing_fixcat_updates_response.json['status'] == 'complete')
  retries: "{{ status_retrieval_retries }}"
  delay: "{{ status_retrieval_delay }}"

# Save the missing fixcat updates operation's response in a file.
- name: Write the results for the missing fixcat updates operation to a JSON file
  block:
    # Perform the copy of the missing fixcat updates response to the file.
    - name: "Copy the missing fixcat updates results to JSON file <{{ missing_fixcat_updates_response_file }}>"
      ansible.builtin.copy:
        content: '{{ missing_fixcat_updates_response.json | default("") | to_nice_json(indent=2) }}'
        dest: '{{ missing_fixcat_updates_response_file }}'
        mode: '0644'
      delegate_to: localhost

    # Save the response content into a local variable.
    - name: Create a variable to hold the value of the missing fixcat updates results
      ansible.builtin.set_fact:
        missing_fixcat_updates_response_json: "{{ missing_fixcat_updates_response.json }}"

# Show the path to the missing fixcat updates REST API results file.
- name: Display the path to the file containing the results from the missing fixcat updates operation
  ansible.builtin.debug:
    msg: "Output filename= {{ missing_fixcat_updates_response_file }}"
